# This is just a template file, which illustrates what
# features/configuration options you have. Copy to to /config and
# uncomment and change applicable parts.

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# TEMPORARY: wipe stale settings (shipped "corne" BLE name + old bonds). Remove after one boot.
CONFIG_ZMK_SETTINGS_RESET_ON_START=y

# Sleep
# CONFIG_ZMK_IDLE_TIMEOUT in ms
CONFIG_ZMK_IDLE_TIMEOUT=10000

# OLED Display settings
# Display is enabled per-half: the CENTRAL (left) half hangs when its OLED is on
# (central-only bug in the power-domains fork), so it's disabled in tukon_left.conf.
# The peripheral (right) half's display stays enabled (default).
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n
# CONFIG_ZMK_WIDGET_WPM_STATUS=y   # optional WPM widget (needs display + ZMK_WPM)

# Select RGB setting
# See https://zmk.dev/docs/config/underglow for optionss
# CONFIG_TUKON_RGB_UNDERGLOW=n # uncomment to disable (? to be tested)
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0: solid color
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START # 0: red, 120: green, 240: blue
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100

# Match the nice!nano bootloader UF2 family (original firmware uses 0x239A00B3,
# not the Zephyr nRF52840 default 0xADA52840)
CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0x239A00B3"